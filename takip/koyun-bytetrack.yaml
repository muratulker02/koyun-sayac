# Üstten yoğun koyun için ByteTrack ayarı (varsayılan: buffer 30, low 0.1, new 0.25)
tracker_type: bytetrack
track_high_thresh: 0.25
track_low_thresh: 0.05     # zayıf kutuyu da ize bağla (kaçırmayı azaltır)
new_track_thresh: 0.45     # kopuk izden sahte yeni numara çıkmasın
track_buffer: 75           # 25 fps'te 3 sn kutusuz kalsa da numarayı tut
match_thresh: 0.85
fuse_score: true
